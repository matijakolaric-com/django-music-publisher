spec:
  name: dmp
  databases:
    - name: default-db
      engine: PG
  services:
    - name: web
      environment_slug: python
      git:
        branch: master
        repo_clone_url: https://github.com/matijakolaric-com/django-music-publisher.git
      build_command: python manage.py collectstatic --noinput
      run_command: waitress-serve --port=$PORT dmp_project.wsgi:application
      http_port: 8080
      health_check:
        http_path: /
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      envs:
        - key: DATABASE_URL
          value: ${default-db.DATABASE_URL}
          scope: RUN_TIME
        - key: SECRET_KEY
          type: SECRET
          scope: RUN_AND_BUILD_TIME
        - key: PUBLISHER
          type: GENERAL
          scope: RUN_TIME
        - key: PUBLISHER_CODE
          type: GENERAL
          scope: RUN_TIME
        - key: PUBLISHER_IPI_NAME
          type: GENERAL
          scope: RUN_TIME
        - key: PUBLISHER_SOCIETY_PR
          type: GENERAL
          scope: RUN_TIME
        - key: PUBLISHER_SOCIETY_MR
          type: GENERAL
          scope: RUN_TIME
