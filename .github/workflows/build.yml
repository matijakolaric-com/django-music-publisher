name: build
on:
  push:
    paths-ignore:
    - 'docs/**'
    - 'static/**'
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          options: "--check --verbose --line-length 79 --exclude music_publisher/migrations"
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:${{ matrix.postgresql-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
    strategy:
      matrix:
        include:
          - python: '3.12'
            postgresql-version: '16'
          - python: '3.13'
            postgresql-version: '17'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Start MinIO
      run: |
        docker run -d -p 9000:9000 --name minio \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          minio/minio server /data

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Setup cache for pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt coverage coveralls moto
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Create MinIO bucket
      run: |
        python -c "
        import boto3
        s3 = boto3.client('s3',
            endpoint_url='http://127.0.0.1:9000',
            aws_access_key_id='minioadmin',
            aws_secret_access_key='minioadmin',
            region_name='us-east-1'
        )
        try:
            s3.create_bucket(Bucket='dmp-test-bucket')
        except Exception as e:
            print(e)
        "

    - name: Test
      env:
          SECRET_KEY: 't569yezjg#_c^4(3_ly=pp+qehy3g$mnu6u4*nkjhvy3bqq356'
          DATABASE_URL: 'postgres://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/postgres'
          OPTION_FILES: 1
          AWS_ACCESS_KEY_ID: 'minioadmin'
          AWS_SECRET_ACCESS_KEY: 'minioadmin'
          AWS_STORAGE_BUCKET_NAME: 'dmp-test-bucket'
          AWS_S3_REGION_NAME: 'us-east-1'
          AWS_S3_ENDPOINT_URL: 'http://127.0.0.1:9000'
          S3_ID: 'minioadmin'
          S3_SECRET: 'minioadmin'
          S3_BUCKET: 'dmp-test-bucket'
          S3_REGION: 'us-east-1'
      run: |
        coverage run  --omit=manage.py manage.py test 

    - name: Coveralls
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        coveralls --service=github
