name: build
on:
  push:
    paths-ignore:
    - 'docs/**'
    - 'static/**'
  pull_request:
    branches:
      - master
    paths-ignore:
    - 'docs/**'
    - 'static/**'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black xenon

      - name: Check code formatting (Black)
        run: black --check --verbose --line-length 79 --exclude music_publisher/migrations .

#      - name: Check static analysis (Ruff)
#        run: ruff check
#
      - name: Check cyclomatic complexity (Xenon)
        run: xenon --max-absolute B --max-modules A --max-average A music_publisher
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:${{ matrix.postgresql-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
    strategy:
      matrix:
        include:
          - python: '3.12'
            postgresql-version: '16'
          - python: '3.13'
            postgresql-version: '17'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}

    - name: Setup cache for pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt coverage coveralls moto django-debug-toolbar
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Test
      env:
          SECRET_KEY: 't569yezjg#_c^4(3_ly=pp+qehy3g$mnu6u4*nkjhvy3bqq356'
          DATABASE_URL: 'postgres://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/postgres'
          OPTION_FILES: 1
      run: |
        coverage run --omit=manage.py manage.py test

    - name: Coveralls
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        coveralls --service=github
